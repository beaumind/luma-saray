name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/prod/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/beaumind/luma-saray:${{ github.sha }}
            ghcr.io/beaumind/luma-saray:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Laravel App with Helm
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check required configuration
        env:
          KUBECONFIG_YML: ${{ secrets.KUBECONFIG_YML }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          missing=""
          for name in KUBECONFIG_YML MYSQL_HOST MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE APP_KEY; do
            val="$(printenv "$name" || true)"
            if [ -z "$val" ] || [ "$val" = "CHANGEME" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets not configured yet (unset or CHANGEME):$missing"
            echo "Fill them in Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG_YML }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure namespace and GHCR pull secret
        run: |
          kubectl create namespace faranex-lumasaray --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=beaumind \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --namespace faranex-lumasaray \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy with Helm
        env:
          DB_HOST: ${{ secrets.MYSQL_HOST }}
          DB_USERNAME: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          helm upgrade --install lumasaray ./.chart \
          --namespace faranex-lumasaray \
          --create-namespace \
          --values ./.chart/values.yaml \
          --set image.php.repository=ghcr.io/beaumind/luma-saray \
          --set image.php.tag=${{ github.sha }} \
          --set image.nginx.repository=docker.arvancloud.ir/nginx \
          --set image.nginx.tag=latest \
          --set-string env.APP_KEY="$APP_KEY" \
          --set-string env.DB_HOST="$DB_HOST" \
          --set-string env.DB_PORT=3306 \
          --set-string env.DB_USERNAME="$DB_USERNAME" \
          --set-string env.DB_PASSWORD="$DB_PASSWORD" \
          --set-string env.DB_DATABASE="$DB_DATABASE"
