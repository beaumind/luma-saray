imagePullSecrets:
  - name: ghcr-pull-secret

replicaCount: 1

scheduler:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

image:
  nginx:
    repository:
    tag:
    pullPolicy: IfNotPresent
  php:
    repository:
    tag:
    pullPolicy: Always

nginxService:
  name: nginx
  type: NodePort
  externalPort: 80
  internalPort: 80

phpfpmService:
  name: phpfpm
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  path: /
  hosts:
    - "lumasaray.faranex.com"
  annotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

redis:
  enabled: true
  image: docker.arvancloud.ir/redis:7-alpine
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "300m"
  port: 6379

env:
  APP_NAME: "LumaSaray"
  APP_ENV: production
  APP_KEY:
  APP_DEBUG: false
  APP_URL: https://lumasaray.faranex.com
  APP_LOCALE: fa
  APP_FALLBACK_LOCALE: fa

  LOG_CHANNEL: stack
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: warning

  DB_CONNECTION: mysql
  DB_HOST:
  DB_PORT: 3306
  DB_DATABASE:
  DB_USERNAME:
  DB_PASSWORD:

  BROADCAST_CONNECTION: log
  CACHE_STORE: redis
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: redis
  # SESSION_DRIVER=file is required — Redis sessions cause Livewire POST redirect-to-login
  SESSION_DRIVER: file
  SESSION_LIFETIME: 480

  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PASSWORD: "null"
  REDIS_PORT: 6379

  MAIL_MAILER: log
  MAIL_HOST: ""
  MAIL_PORT: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_ENCRYPTION: ""
  MAIL_FROM_ADDRESS: "hello@lumasaray.ir"
  MAIL_FROM_NAME: "LumaSaray"
